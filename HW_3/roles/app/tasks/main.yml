- name: Install Python and tar
  apt:
    name: [python3, tar, gzip]
    update_cache: true
    cache_valid_time: 3600

- name: Create app user
  user:
    name: app
    system: true
    create_home: false
    shell: /usr/sbin/nologin

- name: Create app directory
  file:
    path: /opt/app
    state: directory
    mode: "0755"

- name: Unpack app
  unarchive:
    src: "{{ playbook_dir }}/app.tar.gz"
    dest: /opt/app
    owner: root
    group: root

- name: Start app
  command: /opt/app/start.sh

- name: Check app
  uri:
    url: http://127.0.0.1:8080/health
  register: result
  until: result.status == 200
  retries: 10
  delay: 1
